name: Ajuste armonia hero

on:
  push:
    branches:
      - ajuste-armonia-hero

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ajuste-armonia-hero
          fetch-depth: 0
      - name: Aplicar ajuste visual conservador al hero
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = 'id="ajuste-armonia-hero-2026-09-14"'
          if marker in html:
              raise SystemExit(0)
          css = r'''
          <style id="ajuste-armonia-hero-2026-09-14">
          /* Ajuste conservador: solo cabecera/hero para mejorar equilibrio y espacios */
          .site-header{
            min-height:auto !important;
            padding-bottom:28px !important;
          }
          .nav{
            padding:12px 6.5% !important;
            min-height:92px !important;
          }
          .logo{
            width:clamp(280px,20vw,365px) !important;
          }
          .hero{
            width:min(1780px,96%) !important;
            margin:18px auto 0 !important;
            padding:30px 30px 28px !important;
            display:grid !important;
            grid-template-columns:minmax(430px,.82fr) minmax(700px,1.55fr) !important;
            gap:34px !important;
            align-items:center !important;
            background:rgba(255,255,255,.94) !important;
            border:1px solid rgba(0,0,0,.05) !important;
            border-radius:28px !important;
            box-shadow:0 18px 42px rgba(0,0,0,.08) !important;
          }
          .hero-copy{
            padding:8px 0 8px 0 !important;
            min-width:0 !important;
            align-self:center !important;
          }
          .hero-copy-layout,
          .hero-copy-text{
            width:100% !important;
            max-width:none !important;
          }
          .hero-logo-showcase{
            width:100% !important;
            max-width:520px !important;
            margin:0 0 14px !important;
            padding:14px 18px !important;
            border-radius:18px !important;
            min-height:62px !important;
          }
          .hero-logo-showcase img{
            width:180px !important;
            max-height:50px !important;
            object-fit:contain !important;
          }
          .hero-logo-showcase span{
            font-size:14px !important;
            letter-spacing:.11em !important;
          }
          .hero .tag{
            margin:0 0 14px !important;
          }
          .hero h1{
            margin:0 !important;
            max-width:540px !important;
            font-size:clamp(58px,5.2vw,84px) !important;
            line-height:.91 !important;
            letter-spacing:-.035em !important;
          }
          .hero-desc{
            max-width:600px !important;
            margin:18px 0 18px !important;
            font-size:clamp(16px,1.25vw,19px) !important;
            line-height:1.5 !important;
          }
          .hero-actions{
            gap:10px !important;
            margin-top:0 !important;
          }
          .hero-actions .btn{
            min-height:48px !important;
            padding:12px 17px !important;
            font-size:13px !important;
          }
          .hero-media{
            width:100% !important;
            min-width:0 !important;
            align-self:center !important;
            border:0 !important;
            border-radius:22px !important;
            box-shadow:0 16px 34px rgba(0,0,0,.10) !important;
          }
          .hero-media > img,
          .hero-media img.hero-main-image{
            width:100% !important;
            height:auto !important;
            aspect-ratio:16/7 !important;
            object-fit:cover !important;
          }
          @media(max-width:1250px){
            .hero{
              grid-template-columns:minmax(390px,.9fr) minmax(560px,1.35fr) !important;
              gap:24px !important;
              padding:24px !important;
            }
            .hero h1{font-size:clamp(52px,5.4vw,72px) !important;}
          }
          @media(max-width:980px){
            .hero{
              grid-template-columns:1fr !important;
              width:min(94%,980px) !important;
              padding:22px !important;
              gap:22px !important;
            }
            .hero-copy{order:1 !important;}
            .hero-media{order:2 !important;}
            .hero-logo-showcase{max-width:100% !important;}
            .hero h1{max-width:680px !important;}
          }
          @media(max-width:640px){
            .nav{min-height:78px !important;padding:10px 5% !important;}
            .logo{width:230px !important;max-width:64vw !important;}
            .hero{
              width:calc(100% - 18px) !important;
              margin-top:10px !important;
              padding:16px !important;
              border-radius:22px !important;
            }
            .hero-logo-showcase{
              padding:12px 14px !important;
              gap:10px !important;
            }
            .hero-logo-showcase img{width:135px !important;}
            .hero-logo-showcase span{font-size:11px !important;letter-spacing:.06em !important;}
            .hero h1{font-size:clamp(46px,15vw,64px) !important;}
            .hero-desc{font-size:16px !important;}
            .hero-actions .btn{width:100% !important;}
          }
          </style>
          '''
          html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
      - name: Guardar cambios
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mejorar armonia y espaciado del hero"
          git push origin HEAD:ajuste-armonia-hero
