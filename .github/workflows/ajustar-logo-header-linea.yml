name: Ajustar logo header para mostrar linea

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Ajustar tarjeta blanca del logo
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = 'id="ajuste-logo-header-linea-2026-09-15"'
          if marker in html:
              raise SystemExit(0)
          css = r'''
          <style id="ajuste-logo-header-linea-2026-09-15">
          /* Reduce el bloque blanco del logo para dejar visible la linea inferior del header. */
          .nav .brand{
            padding:4px 10px 3px !important;
            border-radius:16px !important;
            min-height:0 !important;
            margin-bottom:8px !important;
            box-shadow:0 8px 18px rgba(0,0,0,.06) !important;
          }
          .nav .brand .logo{
            width:clamp(300px,24vw,390px) !important;
            max-width:56vw !important;
            max-height:68px !important;
            height:auto !important;
            object-fit:contain !important;
          }
          @media(max-width:920px){
            .nav .brand{
              padding:4px 8px 2px !important;
              margin-bottom:7px !important;
            }
            .nav .brand .logo{
              width:270px !important;
              max-height:62px !important;
            }
          }
          @media(max-width:620px){
            .nav .brand{
              padding:3px 7px 2px !important;
              margin-bottom:6px !important;
              border-radius:14px !important;
            }
            .nav .brand .logo{
              width:225px !important;
              max-width:62vw !important;
              max-height:56px !important;
            }
          }
          </style>
          '''
          html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
      - name: Guardar cambios
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reducir bloque blanco del logo y mostrar linea inferior"
          git push origin HEAD:main
