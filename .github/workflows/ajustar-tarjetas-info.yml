name: Ajustar tarjetas informativas aprobadas

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar ajuste aprobado de tarjetas
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = 'id="ajuste-tarjetas-info-v2-2026-09-14"'
          if marker in html:
              raise SystemExit(0)
          css = r'''
          <style id="ajuste-tarjetas-info-v2-2026-09-14">
          .quick-stats.info-strip{
            grid-template-columns:repeat(4,minmax(220px,1fr)) !important;
            gap:18px !important;
            max-width:1380px !important;
            padding:0 5% 58px !important;
            align-items:stretch !important;
          }
          .quick-stats.info-strip .stat-item{
            min-height:132px !important;
            background:#fff !important;
            border:1px solid rgba(0,0,0,.07) !important;
            border-radius:20px !important;
            padding:22px 24px !important;
            box-shadow:0 12px 28px rgba(0,0,0,.08) !important;
            display:flex !important;
            flex-direction:column !important;
            justify-content:center !important;
          }
          .quick-stats.info-strip .stat-item small{
            margin-bottom:7px !important;
            font-size:13px !important;
            line-height:1.2 !important;
          }
          .quick-stats.info-strip .stat-item strong{
            font-size:19px !important;
            line-height:1.28 !important;
            letter-spacing:-.01em !important;
          }
          .quick-stats.info-strip .stat-item span{
            margin-top:6px !important;
            font-size:14px !important;
            line-height:1.45 !important;
            max-width:30ch !important;
          }
          @media(max-width:1050px){
            .quick-stats.info-strip{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
          }
          @media(max-width:700px){
            .quick-stats.info-strip{grid-template-columns:1fr !important; padding-left:5% !important; padding-right:5% !important;}
            .quick-stats.info-strip .stat-item{min-height:118px !important; padding:20px !important;}
          }
          </style>
          '''
          html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
      - name: Guardar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ajustar tamaño y proporción de tarjetas informativas"
          git push origin HEAD:main
