name: Refinar mini marca del hero

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refinar logo secundario y sello
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = 'id="refinar-mini-brand-hero-2026-09-15"'
          if marker in html:
              raise SystemExit(0)
          css = r'''
          <style id="refinar-mini-brand-hero-2026-09-15">
          /* Refinamiento final del bloque pequeño sobre el título. */
          .hero-logo-showcase{
            display:flex !important;
            align-items:center !important;
            width:max-content !important;
            max-width:100% !important;
            min-height:0 !important;
            margin:0 0 10px !important;
            padding:0 !important;
            gap:12px !important;
            background:transparent !important;
            border:0 !important;
            border-left:0 !important;
            border-radius:0 !important;
            box-shadow:none !important;
            animation:none !important;
          }
          .hero-logo-showcase img{
            width:150px !important;
            max-width:32vw !important;
            height:auto !important;
            max-height:42px !important;
            object-fit:contain !important;
            filter:none !important;
          }
          .hero-logo-showcase span{
            font-family:var(--font-body) !important;
            font-size:12px !important;
            line-height:1.25 !important;
            font-weight:700 !important;
            letter-spacing:.16em !important;
            color:#3b3b3b !important;
            white-space:nowrap !important;
            text-transform:uppercase !important;
          }
          .hero .tag{
            display:inline-flex !important;
            align-items:center !important;
            width:max-content !important;
            max-width:100% !important;
            margin:0 0 16px !important;
            padding:8px 14px !important;
            border-radius:999px !important;
            box-shadow:none !important;
            font-family:var(--font-body) !important;
            font-size:11px !important;
            line-height:1 !important;
            font-weight:900 !important;
            letter-spacing:.06em !important;
          }
          @media(max-width:720px){
            .hero-logo-showcase{
              gap:9px !important;
              flex-wrap:wrap !important;
            }
            .hero-logo-showcase img{
              width:132px !important;
              max-width:46vw !important;
            }
            .hero-logo-showcase span{
              font-size:10px !important;
              letter-spacing:.10em !important;
              white-space:normal !important;
            }
            .hero .tag{
              font-size:10px !important;
              padding:8px 12px !important;
            }
          }
          </style>
          '''
          html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
      - name: Guardar cambios
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refinar mini marca y sello del hero"
          git push origin HEAD:main
