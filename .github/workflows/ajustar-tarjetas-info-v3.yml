name: Ajustar tarjetas informativas v3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar tarjetas mas grandes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = 'id="ajuste-tarjetas-info-v3-2026-09-14"'
          if marker in html:
              raise SystemExit(0)
          css = r'''
          <style id="ajuste-tarjetas-info-v3-2026-09-14">
          .quick-stats.info-strip{
            width:min(1480px,94%) !important;
            max-width:1480px !important;
            margin:26px auto 48px !important;
            padding:0 !important;
            display:grid !important;
            grid-template-columns:repeat(4,minmax(260px,1fr)) !important;
            gap:22px !important;
            align-items:stretch !important;
          }
          .quick-stats.info-strip .stat-item{
            min-height:155px !important;
            background:#fff !important;
            border:1px solid rgba(0,0,0,.08) !important;
            border-radius:20px !important;
            padding:24px 24px 22px !important;
            box-shadow:0 10px 24px rgba(0,0,0,.08) !important;
            display:flex !important;
            flex-direction:column !important;
            justify-content:center !important;
            text-align:left !important;
          }
          .quick-stats.info-strip .stat-item + .stat-item{
            border-left:1px solid rgba(0,0,0,.08) !important;
          }
          .quick-stats.info-strip .stat-item small{
            display:block !important;
            margin:0 0 10px !important;
            color:var(--red) !important;
            font-size:13px !important;
            line-height:1.2 !important;
            font-weight:900 !important;
            letter-spacing:.08em !important;
            text-transform:uppercase !important;
          }
          .quick-stats.info-strip .stat-item strong{
            display:block !important;
            margin:0 0 8px !important;
            color:#1b1b1b !important;
            font-family:var(--font-body) !important;
            font-size:19px !important;
            line-height:1.28 !important;
            font-weight:800 !important;
            letter-spacing:-.01em !important;
            text-transform:none !important;
          }
          .quick-stats.info-strip .stat-item span{
            display:block !important;
            margin:0 !important;
            color:#555 !important;
            font-family:var(--font-body) !important;
            font-size:15px !important;
            line-height:1.45 !important;
            font-weight:600 !important;
            letter-spacing:0 !important;
            text-transform:none !important;
          }
          @media(max-width:1180px){
            .quick-stats.info-strip{
              grid-template-columns:repeat(2,minmax(0,1fr)) !important;
              width:min(94%,980px) !important;
            }
          }
          @media(max-width:640px){
            .quick-stats.info-strip{
              grid-template-columns:1fr !important;
              width:min(94%,700px) !important;
              gap:16px !important;
            }
            .quick-stats.info-strip .stat-item{
              min-height:132px !important;
              padding:20px !important;
            }
            .quick-stats.info-strip .stat-item strong{font-size:18px !important;}
            .quick-stats.info-strip .stat-item span{font-size:14px !important;}
          }
          </style>
          '''
          html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
      - name: Guardar cambios
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Agrandar y mejorar tarjetas informativas"
          git push origin HEAD:main
