name: Compactar header y hero

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Ajustar parte superior
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = 'id="ajuste-superior-compacto-2026-09-15"'
          if marker in html:
              raise SystemExit(0)
          css = r'''
          <style id="ajuste-superior-compacto-2026-09-15">
          /* Ajuste final de la parte superior: menos huecos y una sola tarjeta visual. */
          .site-header{
            padding-bottom:0 !important;
          }
          .hero{
            width:min(1780px,97%) !important;
            margin:10px auto 0 !important;
            padding:20px 28px 28px !important;
            gap:28px !important;
          }
          .hero::before,
          .hero::after{
            display:none !important;
            content:none !important;
          }
          .hero-copy{
            padding:14px 16px !important;
            border-radius:22px !important;
            box-shadow:none !important;
            background:transparent !important;
            border:0 !important;
          }
          .hero-logo-showcase{
            margin:0 0 12px !important;
            padding:12px 16px !important;
            min-height:58px !important;
            border-radius:16px !important;
            box-shadow:0 10px 24px rgba(0,0,0,.07) !important;
          }
          .hero-logo-showcase img{
            width:170px !important;
            max-height:46px !important;
          }
          .hero-logo-showcase span{
            font-size:13px !important;
            letter-spacing:.09em !important;
          }
          .hero .tag{
            margin:0 0 12px !important;
          }
          .hero h1{
            margin:0 0 14px !important;
          }
          .hero-desc{
            margin:0 0 16px !important;
          }
          @media(max-width:980px){
            .hero{
              width:min(95%,980px) !important;
              margin-top:8px !important;
              padding:18px !important;
              gap:20px !important;
            }
          }
          @media(max-width:640px){
            .hero{
              width:calc(100% - 14px) !important;
              margin-top:6px !important;
              padding:14px !important;
              border-radius:20px !important;
            }
            .hero-copy{padding:8px !important;}
            .hero-logo-showcase{
              padding:10px 12px !important;
              margin-bottom:10px !important;
            }
            .hero-logo-showcase img{width:132px !important;}
            .hero-logo-showcase span{font-size:11px !important;}
          }
          </style>
          '''
          html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
      - name: Guardar cambios
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Compactar y armonizar la parte superior"
          git push origin HEAD:main
